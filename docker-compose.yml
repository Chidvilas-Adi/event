services:
  db:
    image: postgres:16-alpine
    container_name: vc-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: venturecity
    ports:
      - '5432:5432'
    volumes:
      - vc_pgdata:/var/lib/postgresql/data

volumes:
  vc_pgdata:
